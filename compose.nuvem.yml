# o A4 na nuvem (VM do projeto ods-a4), para tirar o processamento da Jetson: I2, I3, back e front
# do A4 no Kafka do Google Cloud (guia B2, sec. 1). O I1, o S1, o S4 e o P7 usam o mesmo broker.
#   na VM, com i2, i3 e a4 lado a lado:   cd a4 && docker compose -f compose.nuvem.yml up -d --build
#   a4/.env (o compose le sozinho): IP_PUBLICO e A4_TOKEN; opcionais KAFKA, FPS, A4_CALIBRACOES, A4_S4_MEDIA_URL
#
# calibracao (6c, secao 3): o I3 grava o CALIBRATION no registro, anuncia em ods.artifact.published e
# manda o conteudo em ods.i3.calibration; o back aplica na hora. a versao fixada em A4_CALIBRACOES e
# a que o back carrega do registro ao subir. refazer quando a camera mexer, com --versao nova; sem
# clique, o I3 acha a quadra na imagem pelo desenho FIVB (i3/padroes) e a lateral do lado da camera:
#   docker compose -f compose.nuvem.yml run --rm -T i3 --source-id cam0 --versao cal-cam0-3 \
#     --espaco quadra-volei-fivb --origem "canto proximo esquerdo" --eixos "x ao longo dos 18 m, y afastando da camera" \
#     --linhas dados/quadra_mediana.png --padrao padroes/quadra-volei-fivb.json --perto "lateral y=0" < /dev/null
name: a4-nuvem

x-kafka: &kafka ${KAFKA:-34.66.235.91:9093}

services:
  i2:
    build: ../i2
    restart: unless-stopped
    # a camera vem de cada mensagem do I1; o --source-id do I2 so vale no modo csv
    command: [--i1, *kafka, --kafka, *kafka, --fps, "${FPS:-30}"]

  back:
    build: back
    restart: unless-stopped
    ports: ["8000:8000"]
    environment:
      A4_MODO_DEMO: "false"
      A4_KAFKA_ENABLED: "true"
      A4_KAFKA_BOOTSTRAP_SERVERS: *kafka
      A4_TOKEN: ${A4_TOKEN:?defina A4_TOKEN no .env, a API fica aberta na internet}
      A4_CALIBRACOES: ${A4_CALIBRACOES:-}
      A4_S4_MEDIA_URL: ${A4_S4_MEDIA_URL:-}
      A4_DADOS_DIR: /dados
      A4_ARTEFATOS_DIR: /registro
    volumes: [dados:/dados, registro:/registro]

  front:
    build:
      context: front
      args:
        NEXT_PUBLIC_API_URL: http://${IP_PUBLICO:?defina IP_PUBLICO no .env, o navegador chama o back por ele}:8000
    restart: unless-stopped
    ports: ["3000:3000"]

  # roda e termina, uma vez por calibracao: o artefato e versionado como um modelo (6c, I3)
  i3:
    build: ../i3
    profiles: [calibrar]
    entrypoint: [python, -u, main.py, --kafka, *kafka, --registro, /registro]
    volumes: [registro:/registro, ../i3/dados:/app/dados:ro]

# o registro de artefatos da aplicacao: CALIBRATION do I3 em i3/, ZONES do A4 em a4/
volumes:
  dados:
  registro:
